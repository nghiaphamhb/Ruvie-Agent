name: CI

on:
  push:
    branches:
      - main
      - admin-proxy
      - chore/setup-ci
  pull_request:
    branches:
      - main
      - admin-proxy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend test suite
        run: npm --prefix frontend test

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: backend:tests
      RUVIE_PLAYWRIGHT_PATH: ${{ github.workspace }}/frontend/node_modules/playwright
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js for browser tests invoked by Python
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Install frontend prerequisites for existing Python browser tests
        run: |
          npm ci --prefix frontend
          npm install --prefix frontend --no-save --package-lock=false playwright@1.56.1
          ./frontend/node_modules/.bin/playwright install --with-deps chromium
          npm --prefix frontend run build

      - name: Verify disposable PostgreSQL test prerequisite
        run: docker info --format '{{.ServerVersion}}'

      - name: Run full backend test suite
        run: python -B -m unittest discover -s tests -p 'test_*.py'
